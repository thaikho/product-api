name: Product API CI (basic)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run lint/build check (placeholder)
        run: node -e "require('./src/app.js')" &
        continue-on-error: true

      - name: Basic syntax check
        run: node --check src/app.js